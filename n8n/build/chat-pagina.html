<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Olden Sports</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#e9efe9;color:#14231b;display:flex;flex-direction:column}
header{background:#0b6b3a;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:#fff;color:#0b6b3a;display:flex;align-items:center;justify-content:center;font-weight:700}
header h1{font-size:17px;margin:0}header p{font-size:13px;margin:2px 0 0;opacity:.85}
header button{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.aviso{background:#fff4d6;color:#6b4e00;font-size:12px;padding:6px 16px;text-align:center}
#msgs{flex:1;overflow-y:auto;padding:12px 12px 4px;display:flex;flex-direction:column;gap:6px}
.m{max-width:82%;padding:8px 12px;border-radius:12px;line-height:1.4;font-size:15px;white-space:normal;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.lia{background:#fff;align-self:flex-start;border-top-left-radius:4px}
.eu{background:#d4f5d0;align-self:flex-end;border-top-right-radius:4px}
.m img{max-width:100%;border-radius:8px;margin:6px 0;display:block}
.m a{color:#0b6b3a;word-break:break-all}
.digitando{font-size:13px;color:#5b6b62;padding:0 16px 6px;min-height:20px}
form{display:flex;gap:8px;padding:8px;background:#f3f5f4;border-top:1px solid #dde4df}
input{flex:1;border:1px solid #cfd8d3;border-radius:20px;padding:10px 14px;font-size:16px;outline:none}
form button{background:#0b6b3a;color:#fff;border:0;border-radius:20px;padding:0 18px;font-size:15px;font-weight:600;cursor:pointer}
form button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <div class="avatar">L</div>
  <div><h1>Lia · Olden Sports</h1><p>Atendimento</p></div>
  <button id="nova" type="button">Nova conversa</button>
</header>
<div class="aviso">Ambiente de demonstração</div>
<div id="msgs"></div>
<div class="digitando" id="digitando"></div>
<form id="f"><input id="t" autocomplete="off" placeholder="Digite sua mensagem..."><button id="b">Enviar</button></form>
<script>
(function () {
  var BOAS_VINDAS = 'Oi! Aqui é a Lia, da Olden Sports 😊\nO que você está procurando hoje?';
  var guardar = {
    ler: function (k, padrao) { try { var v = localStorage.getItem(k); return v === null ? padrao : JSON.parse(v); } catch (e) { return padrao; } },
    gravar: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  function novoId() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^a-zA-Z0-9-]/g, ''); }
  var estado = guardar.ler('olden_chat', null);
  if (!estado || !estado.sessao) estado = { sessao: novoId(), ultimo: 0, msgs: [{ de: 'lia', texto: BOAS_VINDAS }] };
  var caixa = document.getElementById('msgs'), digitando = document.getElementById('digitando');
  var form = document.getElementById('f'), input = document.getElementById('t'), botao = document.getElementById('b');

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function formatar(texto) {
    var h = esc(texto);
    h = h.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<img alt="$1" src="$2">');
    h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return h.replace(/\n/g, '<br>');
  }
  function mostrar(m) {
    var d = document.createElement('div');
    d.className = 'm ' + (m.de === 'eu' ? 'eu' : 'lia');
    d.innerHTML = formatar(m.texto);
    caixa.appendChild(d);
    caixa.scrollTop = caixa.scrollHeight;
  }
  function adicionar(m) { estado.msgs.push(m); guardar.gravar('olden_chat', estado); mostrar(m); }
  estado.msgs.forEach(mostrar);

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var texto = input.value.trim();
    if (!texto) return;
    input.value = ''; adicionar({ de: 'eu', texto: texto });
    botao.disabled = true; digitando.textContent = 'Lia está digitando...';
    fetch('olden-chat-enviar', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sessao: estado.sessao, mensagem: texto }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { adicionar({ de: 'lia', texto: j.resposta || 'Desculpa, tive um probleminha aqui. Pode repetir?' }); })
      .catch(function () { adicionar({ de: 'lia', texto: 'Desculpa, tive um probleminha aqui. Pode repetir?' }); })
      .then(function () { botao.disabled = false; digitando.textContent = ''; input.focus(); });
  });

  // Mensagens que a Lia manda por iniciativa própria (ex.: pagamento aprovado)
  function buscarNovas() {
    fetch('olden-chat-novas?s=' + encodeURIComponent(estado.sessao) + '&depois=' + estado.ultimo)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        (j.mensagens || []).forEach(function (m) {
          if (m.id > estado.ultimo) { estado.ultimo = m.id; adicionar({ de: 'lia', texto: m.texto }); }
        });
      })
      .catch(function () {});
  }
  setInterval(buscarNovas, 3000); buscarNovas();

  document.getElementById('nova').addEventListener('click', function () {
    estado = { sessao: novoId(), ultimo: 0, msgs: [{ de: 'lia', texto: BOAS_VINDAS }] };
    guardar.gravar('olden_chat', estado);
    caixa.innerHTML = ''; estado.msgs.forEach(mostrar); input.focus();
  });
})();
</script>
</body>
</html>
